name: Windows release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload the exe to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyside6 controku requests pillow pyinstaller

      - name: Build exe
        run: |
          python -c "from PIL import Image; Image.open('assets/roku-remote.png').save('roku-remote.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
          pyinstaller --noconfirm --windowed --onefile --name roku-remote --icon roku-remote.ico --add-data "assets/roku-remote.png;." launcher.py
          Move-Item dist/roku-remote.exe dist/roku-remote-windows-x86_64.exe

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ inputs.tag }} dist/roku-remote-windows-x86_64.exe --clobber --repo ${{ github.repository }}
